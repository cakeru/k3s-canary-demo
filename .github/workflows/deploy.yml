name: Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: canary-demo
  NAMESPACE: demo-apps

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        run: |
          kubectl apply -f k8s/ -R --namespace ${{ env.NAMESPACE }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} --namespace ${{ env.NAMESPACE }} --timeout=60s
          kubectl get pods --namespace ${{ env.NAMESPACE }} -l app=${{ env.APP_NAME }}
